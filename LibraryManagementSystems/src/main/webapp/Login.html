<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to right,#74ebd5,#9face6);
    margin:0;
    padding:0;
}

h1{
    text-align:center;
    margin-top:40px;
    color:#333;
}

form{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
    width:300px;
    margin:30px auto;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus{
    border-color:#6c63ff;
    outline:none;
    box-shadow:0 0 5px rgba(108,99,255,0.5);
}

button{
    width:100%;
    padding:10px;
    background:#6c63ff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#574fd6;
}
</style>
</head>

<body>
<h1>Login form</h1>
<form action="Login" method="post">
email:<br>
<input type="email" name="email" value="example@gmail.com">
<br>
Password:<br>
<input type="password" name="password" value="sirisha@123">
<br>
<button>Login</button>
</form>
</body>
</html>
